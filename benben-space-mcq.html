<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>科幻博士奔奔（选择题） - 宇宙知识大挑战</title>
<style>
:root{
  --bg0:#0a0a2e;--bg1:#111155;--bg2:#1a1a6e;
  --neon:#6ec6ff;--gold:#ffd740;--green:#69f0ae;--red:#ff5252;
  --text:#e8f0ff;--muted:rgba(180,200,240,0.65);
  --card:rgba(12,18,60,0.92);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  background:radial-gradient(ellipse at 30% 20%,#1a2a7a 0%,#060916 60%);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:12px 10px 40px;overflow-x:hidden;position:relative;
  color:var(--text);user-select:none;
}
#stars-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#app{width:100%;max-width:500px;position:relative;z-index:10;}
.card{
  background:var(--card);border:1px solid rgba(110,198,255,0.25);
  border-radius:var(--r);padding:18px 16px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.card-title{
  font-size:15px;font-weight:700;letter-spacing:0.5px;
  color:var(--neon);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.card-title .q-num{
  background:var(--neon);color:var(--bg0);border-radius:50%;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;flex-shrink:0;
}
.btn{
  display:block;width:100%;padding:14px 16px;border:2px solid rgba(110,198,255,0.3);
  border-radius:14px;background:rgba(110,198,255,0.08);color:var(--text);
  font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s;
  text-align:left;margin-bottom:10px;outline:none;
}
.btn:hover{border-color:var(--neon);background:rgba(110,198,255,0.18);transform:translateY(-1px);}
.btn:active{transform:scale(0.98);}
.btn.correct{border-color:var(--green);background:rgba(105,240,174,0.2);color:var(--green);}
.btn.wrong{border-color:var(--red);background:rgba(255,82,82,0.2);color:var(--red);animation:shake .4s;}
.btn.disabled{pointer-events:none;opacity:0.6;}
.btn.show-correct{border-color:var(--green);background:rgba(105,240,174,0.15);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.avatar-card{
  display:flex;align-items:center;gap:16px;background:var(--card);
  border:1px solid rgba(110,198,255,0.3);border-radius:var(--r);
  padding:14px 18px;margin-bottom:16px;
}
.avatar-img{
  width:56px;height:56px;border-radius:50%;border:2px solid var(--neon);
  object-fit:cover;flex-shrink:0;background:var(--bg1);
}
.avatar-info h2{font-size:17px;color:var(--neon);margin-bottom:2px;}
.avatar-info p{font-size:13px;color:var(--muted);}

.progress-bar{
  height:6px;background:rgba(110,198,255,0.15);border-radius:3px;
  margin-bottom:16px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--neon),var(--gold));
  border-radius:3px;transition:width 0.4s;
}
.timer-display{
  text-align:center;font-size:24px;font-weight:800;color:var(--gold);
  margin-bottom:12px;font-variant-numeric:tabular-nums;
}
.timer-display.urgent{color:var(--red);animation:pulse 0.5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

.feedback{
  text-align:center;padding:10px 14px;border-radius:12px;
  margin-bottom:12px;font-size:14px;font-weight:600;display:none;
}
.feedback.show{display:block;}
.feedback.ok{background:rgba(105,240,174,0.15);color:var(--green);border:1px solid rgba(105,240,174,0.3);}
.feedback.no{background:rgba(255,82,82,0.15);color:var(--red);border:1px solid rgba(255,82,82,0.3);}

.next-btn{
  display:none;width:100%;padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--neon),#4a90d9);
  color:var(--bg0);font-size:17px;font-weight:700;cursor:pointer;
  transition:all 0.2s;margin-top:10px;
}
.next-btn.show{display:block;animation:fadeIn .3s;}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(110,198,255,0.35);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.7);z-index:100;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .3s;
}
.overlay-box{
  background:var(--card);border:1px solid rgba(110,198,255,0.4);
  border-radius:20px;padding:28px 24px;width:90%;max-width:400px;
  text-align:center;
}
.overlay-box h2{font-size:22px;color:var(--neon);margin-bottom:6px;}
.overlay-box .sub{font-size:14px;color:var(--muted);margin-bottom:16px;}
.overlay-box .score-big{font-size:56px;font-weight:900;color:var(--gold);line-height:1.1;}
.overlay-box .score-label{font-size:14px;color:var(--muted);margin-bottom:8px;}
.overlay-box .stars{font-size:38px;margin:10px 0;}
.overlay-box .comment{font-size:16px;color:var(--neon);margin-bottom:16px;font-weight:600;}

.overlay-box input{
  width:100%;padding:14px;border-radius:12px;border:2px solid rgba(110,198,255,0.3);
  background:rgba(110,198,255,0.08);color:var(--text);font-size:17px;
  text-align:center;outline:none;margin-bottom:16px;
}
.overlay-box input:focus{border-color:var(--neon);}
.overlay-box input::placeholder{color:var(--muted);}

.btn-primary{
  display:inline-block;padding:14px 36px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--neon),#4a90d9);
  color:var(--bg0);font-size:17px;font-weight:700;cursor:pointer;
  transition:all 0.2s;margin:6px;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(110,198,255,0.35);}
.btn-secondary{
  display:inline-block;padding:12px 28px;border:2px solid rgba(110,198,255,0.4);
  border-radius:14px;background:transparent;color:var(--neon);
  font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;margin:6px;
}
.btn-secondary:hover{background:rgba(110,198,255,0.12);}

.leaderboard-table{width:100%;border-collapse:collapse;margin-top:12px;}
.leaderboard-table th{
  text-align:left;padding:10px 8px;font-size:13px;color:var(--muted);
  border-bottom:2px solid rgba(110,198,255,0.2);font-weight:600;
}
.leaderboard-table td{
  padding:10px 8px;font-size:14px;border-bottom:1px solid rgba(110,198,255,0.08);
}
.leaderboard-table tr.current{background:rgba(110,198,255,0.15);font-weight:700;}
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;
}
.rank-1{background:var(--gold);color:var(--bg0);}
.rank-2{background:#c0c0c0;color:var(--bg0);}
.rank-3{background:#cd7f32;color:var(--bg0);}

.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;}
.confetti{
  position:absolute;width:12px;height:12px;animation:confettiFall 3s ease-in forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

.music-toggle{
  position:fixed;top:16px;right:16px;z-index:300;
  width:42px;height:42px;border-radius:50%;border:2px solid rgba(110,198,255,0.4);
  background:rgba(12,18,60,0.7);backdrop-filter:blur(10px);
  color:var(--neon);font-size:20px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:all 0.2s;
  -webkit-backdrop-filter:blur(10px);
}
.music-toggle:hover{border-color:var(--neon);background:rgba(110,198,255,0.15);}

@media(max-width:380px){
  .avatar-img{width:44px;height:44px;}
  .btn{font-size:14px;padding:12px 14px;}
}
</style>
</head>

// ==================== AUDIO ENGINE ====================
var audioCtx = null;
var bgmGain = null;
var bgmPlaying = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.08;
    bgmGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playSfx(type) {
  initAudio();
  if (type === 'correct') {
    playTone(523, 0.12, 'sine', 0.2);
    setTimeout(function(){ playTone(659, 0.12, 'sine', 0.2); }, 100);
    setTimeout(function(){ playTone(784, 0.2, 'sine', 0.2); }, 200);
  } else if (type === 'wrong') {
    playTone(200, 0.2, 'square', 0.15);
    setTimeout(function(){ playTone(180, 0.3, 'square', 0.12); }, 150);
  } else if (type === 'click') {
    playTone(800, 0.06, 'sine', 0.1);
  }
}

function startBGM() {
  if (bgmPlaying) return;
  initAudio();
  bgmPlaying = true;
  loopBGM();
}

var bgmNotes = [262,294,330,349,392,349,330,294,262,294,330,349,392,440,392,349];
var bgmIdx = 0;
function loopBGM() {
  if (!bgmPlaying || !audioCtx) return;
  playTone(bgmNotes[bgmIdx % bgmNotes.length], 0.35, 'triangle', 0.06);
  bgmIdx++;
  setTimeout(loopBGM, 450);
}

function toggleMusic() {
  initAudio();
  var btn = document.getElementById('musicToggle');
  if (bgmPlaying) {
    bgmPlaying = false;
    btn.textContent = '🔇';
  } else {
    bgmPlaying = true;
    btn.textContent = '🎵';
    loopBGM();
  }
}

// ==================== STARS ====================
(function() {
  var canvas = document.getElementById('stars-canvas');
  var ctx = canvas.getContext('2d');
  var stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (var i = 0; i < 150; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      a: Math.random(),
      speed: Math.random() * 0.02 + 0.005
    });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      s.a += s.speed;
      if (s.a > 1) s.a = 0;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(180,220,255,' + Math.sin(s.a * Math.PI).toFixed(2) + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

  { q: '晚上看不到月亮，可能是因为？', a: 'A. 被云挡住了', b: 'B. 月亮消失了', answer: 'A' },
];

var advancedQuestions = [
  { q: '地球围绕谁转动？', a: 'B. 太阳', b: 'A. 月亮', answer: 'B' },
  { q: '出太空舱活动，宇航员必须穿？', a: 'B. 宇航服', b: 'A. 普通衣服', answer: 'B' },
  { q: '空间站是人类在太空的什么？', a: 'A. 房子', b: 'B. 玩具', answer: 'A' },
  { q: '无人机需要人坐在上面驾驶吗？', a: 'B. 不需要', b: 'A. 需要', answer: 'B' },
  { q: '太阳系最大的行星是？', a: 'A. 木星', b: 'B. 火星', answer: 'A' },
  { q: '黑洞的特点是什么？', a: 'A. 引力很强，会吸东西', b: 'B. 空空的什么都不吸', answer: 'A' },
  { q: '流星雨是什么？', a: 'B. 小石块划过大气层发光', b: 'A. 星星掉下来', answer: 'B' },
  { q: '下面哪个星球离地球比较近？', a: 'A. 火星', b: 'B. 水星', answer: 'A' },
  { q: '银河是由什么组成的？', a: 'B. 无数星星', b: 'A. 云朵', answer: 'B' },
  { q: '所有星球都有花草树木吗？', a: 'B. 不是', b: 'A. 都有', answer: 'B' },
];

// ==================== GAME STATE ====================
var playerName = localStorage.getItem('bb_mcq_name') || '';
var currentRound = 1;
var currentQuestions = [];
var currentIdx = 0;
var currentScore = 0;
var timerInterval = null;
var timeLeft = 20;
var answered = false;

// ==================== SHUFFLE ====================
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickQuestions() {
  var basic = shuffle(basicQuestions).slice(0, 3);
  var adv = shuffle(advancedQuestions).slice(0, 2);
  // Tag as basic/advanced
  for (var i = 0; i < basic.length; i++) basic[i].type = 'basic';
  for (var i = 0; i < adv.length; i++) adv[i].type = 'advanced';
  return shuffle(basic.concat(adv));
}

// ==================== LEADERBOARD ====================
function loadLeaderboard() {
  try { return JSON.parse(localStorage.getItem('bb_mcq_lb') || '[]'); }
  catch (e) { return []; }
}

function saveLeaderboard(lb) { localStorage.setItem('bb_mcq_lb', JSON.stringify(lb)); }

function updateLeaderboard(name, pts, round) {
  var lb = loadLeaderboard();
  lb.push({ name: name, pts: pts, round: round, time: Date.now() });
  lb.sort(function(a, b) { return b.pts - a.pts || a.time - b.time; });
  lb = lb.slice(0, 20);
  saveLeaderboard(lb);
}

// ==================== CONFETTI ====================
function showConfetti() {
  var wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  var colors = ['#ffd740','#69f0ae','#6ec6ff','#ff5252','#e040fb','#40c4ff','#b2ff59'];
  for (var i = 0; i < 80; i++) {
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = -(Math.random() * 20) + 'px';
    c.style.width = (Math.random() * 10 + 6) + 'px';
    c.style.height = (Math.random() * 10 + 6) + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDuration = (Math.random() * 2 + 2) + 's';
    c.style.animationDelay = Math.random() * 0.8 + 's';
    wrap.appendChild(c);
  }
  setTimeout(function() { wrap.innerHTML = ''; }, 4000);
}

// ==================== RENDER ====================
function renderApp(content) {
  document.getElementById('app').innerHTML = content;
}

function renderQuestion() {
  if (currentIdx >= currentQuestions.length) {
    showScore();
    return;
  }
  var q = currentQuestions[currentIdx];
  var total = currentQuestions.length;
  var pct = (currentIdx / total) * 100;
  answered = false;
  timeLeft = 20;
  clearInterval(timerInterval);

  var timerClass = timeLeft <= 5 ? 'timer-display urgent' : 'timer-display';
  var typeLabel = q.type === 'advanced' ? '🔬 ' : '';
  var nextLabel = currentIdx + 1 < total ? '下一题 →' : '查看成绩';

  var nextHidden = 'next-btn';
  var feedbackHidden = 'feedback';

  renderApp('<div class="avatar-card">' +
    '<img class="avatar-img" src="' + AVATAR_URL + '" alt="奔奔博士">' +
    '<div class="avatar-info">' +
      '<h2>科幻博士奔奔</h2>' +
      '<p>第' + currentRound + '轮 · 第' + (currentIdx + 1) + '/' + total + '题</p>' +
    '</div>' +
    '</div>' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="' + timerClass + '" id="timerDisplay">⏱ ' + timeLeft + 's</div>' +
    '<div class="' + feedbackHidden + '" id="feedback"></div>' +
    '<div class="card">' +
      '<div class="card-title"><span class="q-num">' + (currentIdx + 1) + '</span><span>' + typeLabel + q.q + '</span></div>' +
      '<button class="btn" id="opt-A" onclick="answer(&amp;#39;A&amp;#39;)">' + q.a + '</button>' +
      '<button class="btn" id="opt-B" onclick="answer(&amp;#39;B&amp;#39;)">' + q.b + '</button>' +
      '<button class="' + nextHidden + '" id="next-btn" onclick="nextQuestion()">' + nextLabel + '</button>' +
    '</div>');

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  var display = document.getElementById('timerDisplay');
  timerInterval = setInterval(function() {
    timeLeft--;
    if (display) {
      display.textContent = '⏱ ' + timeLeft + 's';
      if (timeLeft <= 5) display.className = 'timer-display urgent';
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) {
        answered = true;
        showTimeout();
      }
    }
  }, 1000);
}

// ==================== ANSWER ====================
function answer(choice) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  playSfx('click');

  var q = currentQuestions[currentIdx];
  var isCorrect = (choice === q.answer);
  var elA = document.getElementById('opt-A');
  var elB = document.getElementById('opt-B');

  // Disable buttons
  if (elA) { elA.disabled = true; elA.classList.add('disabled'); }
  if (elB) { elB.disabled = true; elB.classList.add('disabled'); }

  if (isCorrect) {
    currentScore++;
    playSfx('correct');
    var choiceEl = document.getElementById('opt-' + choice);
    if (choiceEl) choiceEl.classList.add('correct');
    var fb = document.getElementById('feedback');
    if (fb) {
      fb.textContent = '🎉 太棒了！回答正确！';
      fb.className = 'feedback show ok';
    }
  } else {
    playSfx('wrong');
    var wrongEl = document.getElementById('opt-' + choice);
    if (wrongEl) wrongEl.classList.add('wrong');
    var correctEl = document.getElementById('opt-' + q.answer);
    if (correctEl) correctEl.classList.add('correct');
    var fb = document.getElementById('feedback');
    if (fb) {
      fb.textContent = '❌ 答错了，正确答案是「' + q.answer + '」';
      fb.className = 'feedback show no';
    }
  }

  // Show next button
  var nb = document.getElementById('next-btn');
  if (nb) {
    nb.textContent = currentIdx + 1 < currentQuestions.length ? '下一题 →' : '查看成绩';
    nb.className = 'next-btn show';
  }
}

function showTimeout() {
  var q = currentQuestions[currentIdx];
  var elA = document.getElementById('opt-A');
  var elB = document.getElementById('opt-B');
  if (elA) { elA.disabled = true; elA.classList.add('disabled'); }
  if (elB) { elB.disabled = true; elB.classList.add('disabled'); }
  var correctEl = document.getElementById('opt-' + q.answer);
  if (correctEl) correctEl.classList.add('correct');
  var fb = document.getElementById('feedback');
  if (fb) {
    fb.textContent = '⏰ 时间到！正确答案是「' + q.answer + '」';
    fb.className = 'feedback show no';
  }
  var nb = document.getElementById('next-btn');
  if (nb) {
    nb.textContent = currentIdx + 1 < currentQuestions.length ? '下一题 →' : '查看成绩';
    nb.className = 'next-btn show';
  }
}

// ==================== NEXT QUESTION ====================
function nextQuestion() {
  playSfx('click');
  currentIdx++;
  if (currentIdx >= currentQuestions.length) {
    showScore();
  } else {
    renderQuestion();
  }
}

// ==================== SCORE ====================
function showScore() {
  clearInterval(timerInterval);
  var total = currentQuestions.length;
  var pct = Math.round(currentScore / total * 100);
  var stars = pct >= 80 ? '⭐⭐⭐' : pct >= 60 ? '⭐⭐' : pct >= 40 ? '⭐' : '💪';
  var comment = pct >= 80 ? '太厉害了！宇宙小博士！🪐' :
                pct >= 60 ? '很棒！继续加油！🚀' :
                pct >= 40 ? '还不错，再试试！🌟' : '别气馁，再来一次！💫';

  updateLeaderboard(playerName, pct, currentRound);
  if (pct >= 80) showConfetti();

  renderApp('<div class="card" style="text-align:center;">' +
    '<img class="avatar-img" src="' + AVATAR_URL + '" style="width:72px;height:72px;margin-bottom:12px;display:inline-block;" alt="奔奔博士">' +
    '<div class="score-label">第 ' + currentRound + ' 轮成绩</div>' +
    '<div class="score-big">' + pct + '<span style="font-size:22px;">分</span></div>' +
    '<div class="stars">' + stars + '</div>' +
    '<div class="comment">' + comment + '</div>' +
    '<div style="margin-top:8px;font-size:14px;color:var(--muted);">答对 ' + currentScore + '/' + total + ' 题</div>' +
    '<div style="margin-top:18px;">' +
      '<button class="btn-primary" onclick="startNewRound()">🔄 再挑战一轮</button>' +
      '<button class="btn-secondary" onclick="showBoard()">🏆 查看排行榜</button>' +
    '</div>' +
    '</div>');
}

function showBoard() {
  var lb = loadLeaderboard();
  var rows = '';
  for (var i = 0; i < lb.length; i++) {
    var e = lb[i];
    var isCurrent = (e.name === playerName && e.round === currentRound);
    var rankHtml = '';
    if (i === 0) rankHtml = '<span class="rank-badge rank-1">1</span>';
    else if (i === 1) rankHtml = '<span class="rank-badge rank-2">2</span>';
    else if (i === 2) rankHtml = '<span class="rank-badge rank-3">3</span>';
    else rankHtml = '<span style="color:var(--muted)">' + (i + 1) + '</span>';
    rows += '<tr' + (isCurrent ? ' class="current"' : '') + '>' +
      '<td>' + rankHtml + '</td><td>' + e.name + '</td><td>' + e.pts + '分</td><td>第' + e.round + '轮</td></tr>';
  }
  var empty = lb.length === 0 ? '<p style="text-align:center;color:var(--muted);padding:20px;">还没有人挑战过，快来成为第一名！🚀</p>' : '';

  renderApp('<div class="card">' +
    '<div class="card-title" style="text-align:center;">🏆 宇宙挑战排行榜</div>' +
    '<table class="leaderboard-table"><thead><tr><th>排名</th><th>玩家</th><th>得分</th><th>轮次</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    empty +
    '<div style="text-align:center;margin-top:16px;">' +
      '<button class="btn-primary" onclick="startNewRound()">🔄 再挑战一轮</button>' +
    '</div>' +
    '</div>');
}

function showNameInput() {
  renderApp('<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;">' +
    '<div class="card" style="text-align:center;width:100%;">' +
      '<img class="avatar-img" src="' + AVATAR_URL + '" style="width:80px;height:80px;margin-bottom:10px;display:inline-block;" alt="奔奔博士">' +
      '<h2 style="color:var(--neon);margin-bottom:4px;">科幻博士奔奔</h2>' +
      '<p style="color:var(--muted);margin-bottom:20px;">宇宙知识选择题挑战 🪐</p>' +
      '<p style="font-size:14px;color:var(--muted);margin-bottom:14px;">' +
        '每轮随机5道题 <span style="color:var(--gold);">（3基础 + 2进阶）</span><br>每题限时20秒，加油！</p>' +
      '<input type="text" id="nameInput" placeholder="给自己取个名字吧..." maxlength="12" value="' + playerName.replace(/"/g, '&quot;') + '" onkeydown="if(event.key==='Enter')confirmName()">' +
      '<button class="btn-primary" onclick="confirmName()" style="width:80%;">🚀 开始挑战</button>' +
    '</div>' +
    '</div>');
  setTimeout(function() {
    var inp = document.getElementById('nameInput');
    if (inp) inp.focus();
  }, 300);
}

function confirmName() {
  var inp = document.getElementById('nameInput');
  var name = (inp && inp.value ? inp.value.trim() : '') || '宇宙探险家';
  playerName = name;
  localStorage.setItem('bb_mcq_name', name);
  playSfx('click');
  startBGM();
  startNewRound();
}

function startNewRound() {
  currentRound++;
  currentQuestions = pickQuestions();
  currentIdx = 0;
  currentScore = 0;
  renderQuestion();
  startBGM();
}

// ==================== INIT ====================
(function() {
  if (playerName) {
    startBGM();
    startNewRound();
  } else {
    showNameInput();
  }
})();
</script>
