<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运指挥官</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #0d0b2e 0%, #1a1450 30%, #2d1b69 60%, #1a1450 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; position: relative;
  }

  /* === Stars Canvas === */
  #bgCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  /* === Campus SVG Elements === */
  .campus-elem {
    position: absolute; pointer-events: none; z-index: 1;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
  }
  .school-build { bottom: -10px; left: 3%; width: 160px; height: 130px; opacity: 0.18; }
  .school-build2 { bottom: -10px; right: 5%; width: 140px; height: 110px; opacity: 0.15; transform: scaleX(-1); }
  .blackboard { top: 50%; left: 2%; transform: translateY(-50%) rotate(-3deg); width: 100px; height: 80px; opacity: 0.13; }
  .cherry-left { bottom: 10px; left: 1%; width: 180px; height: 200px; opacity: 0.2; }
  .cherry-right { bottom: 15px; right: 2%; width: 150px; height: 170px; opacity: 0.17; }
  .cherry-top { top: 5px; left: 15%; width: 120px; height: 100px; opacity: 0.14; transform: rotate(10deg); }
  .pencil { top: 12%; right: 4%; width: 40px; height: 160px; opacity: 0.12; transform: rotate(15deg); }
  .apple-icon { top: 20%; left: 6%; width: 50px; height: 55px; opacity: 0.16; }
  .book-stack { bottom: 30px; left: 50%; transform: translateX(-50%); width: 80px; height: 50px; opacity: 0.12; }

  /* Floating cherry petals */
  .petal {
    position: fixed; pointer-events: none; z-index: 2;
    width: 12px; height: 10px; border-radius: 50% 0 50% 50%;
    opacity: 0;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { opacity: 0; transform: translateY(-20px) rotate(0deg) scale(0.8); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.4); }
  }

  /* === Magic Circles === */
  .magic-circle {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 1;
  }
  .magic-circle-main {
    width: 240px; height: 240px; top: -10px; right: 40px;
    background: radial-gradient(circle, rgba(255,215,0,0.12) 0%, transparent 70%);
    animation: rotateCircle 12s linear infinite;
  }
  .magic-circle-main svg { width: 100%; height: 100%; }
  .magic-circle-small {
    width: 130px; height: 130px; bottom: 70px; left: 30px;
    background: radial-gradient(circle, rgba(180,130,255,0.1) 0%, transparent 70%);
    animation: rotateCircle 18s linear infinite reverse;
  }
  .magic-circle-small svg { width: 100%; height: 100%; }
  @keyframes rotateCircle { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* === Main Content === */
  .main-container {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
  }

  /* === Group Badge === */
  .group-badge {
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
    border: 1.5px solid rgba(255,215,0,0.4);
    border-radius: 20px;
    padding: 6px 28px;
    backdrop-filter: blur(8px);
    margin-bottom: 4px;
  }
  .group-badge span {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(90deg, #ffd700, #ffb347);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    filter: drop-shadow(0 0 6px rgba(255,215,0,0.4));
  }

  /* === Robot Avatar === */
  .robot-avatar-wrap {
    position: relative;
    width: 130px; height: 150px;
    margin-bottom: -6px;
  }
  .robot-avatar {
    width: 130px; height: 140px;
    filter: drop-shadow(0 0 18px rgba(255,105,180,0.4));
    animation: floatBot 3s ease-in-out infinite;
  }
  @keyframes floatBot {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Cherry on robot head */
  .cherry-on-head {
    position: absolute; top: 4px; right: 18px;
    width: 38px; height: 32px;
    animation: cherryBob 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255,150,180,0.6));
  }
  @keyframes cherryBob {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.05); }
  }

  /* === Title === */
  .title {
    font-size: 30px; font-weight: 900;
    background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 6px;
    filter: drop-shadow(0 0 10px rgba(255,215,0,0.5));
  }

  /* === Wheel Container === */
  .wheel-wrapper {
    position: relative; width: 300px; height: 300px; margin: 6px 0;
  }
  .wheel-pointer {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    z-index: 30; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .wheel-glow-ring {
    position: absolute; top: -10px; left: -10px;
    width: 320px; height: 320px; border-radius: 50%;
    border: 3px solid transparent;
    background: conic-gradient(from 0deg, #ffd700, #ff69b4, #87ceeb, #ffd700, #ff69b4, #87ceeb, #ffd700) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: rotateCircle 4s linear infinite;
    z-index: 5; opacity: 0.8;
  }
  .wheel-glow-ring::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,215,0,0.3), 0 0 60px rgba(255,105,180,0.15);
  }
  #wheelCanvas {
    width: 300px; height: 300px;
    border-radius: 50%;
    box-shadow: 0 0 0 5px rgba(255,255,255,0.15), 0 0 35px rgba(255,215,0,0.25);
    cursor: pointer;
    transition: filter 0.3s;
  }
  #wheelCanvas:hover { filter: brightness(1.05); }
  .center-btn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 74px; height: 74px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff5, #ffd700);
    border: 3px solid rgba(255,255,255,0.5);
    box-shadow: 0 0 20px rgba(255,215,0,0.6), 0 4px 15px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 900; color: #5a2d0c;
    cursor: pointer; z-index: 20;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 2px;
  }
  .center-btn:hover { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 0 30px rgba(255,215,0,0.9); }
  .center-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  .center-btn.disabled { pointer-events: none; opacity: 0.5; }

  /* === Result Display (ENLARGED) === */
  .result-area {
    min-height: 80px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; opacity: 0; transition: opacity 0.5s; pointer-events: none;
    position: relative; z-index: 15;
  }
  .result-area.show { opacity: 1; pointer-events: auto; }
  .result-main {
    font-size: 52px; font-weight: 900;
    color: #ffd700;
    text-shadow: 0 0 30px rgba(255,215,0,0.7), 0 0 60px rgba(255,215,0,0.3), 0 4px 8px rgba(0,0,0,0.5);
    letter-spacing: 6px;
    animation: resultBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .result-punish {
    font-size: 30px; font-weight: 700;
    color: #ff8c94;
    text-shadow: 0 0 18px rgba(255,100,120,0.6), 0 2px 4px rgba(0,0,0,0.4);
    animation: resultBounce 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
  }
  @keyframes resultBounce {
    0% { transform: scale(0.2); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* === Group Navigation === */
  .group-nav {
    display: flex; align-items: center; gap: 16px;
    margin-top: 8px; z-index: 15;
  }
  .nav-btn {
    padding: 8px 24px; border-radius: 25px;
    border: 2px solid rgba(255,215,0,0.5);
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,140,0,0.15));
    color: #ffd700; font-size: 16px; font-weight: 700;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: all 0.2s; letter-spacing: 1px;
  }
  .nav-btn:hover { background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,140,0,0.3)); transform: scale(1.05); }

  /* === Music Toggle === */
  .music-btn {
    position: fixed; top: 16px; right: 16px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(10px);
    transition: background 0.2s;
  }
  .music-btn:hover { background: rgba(255,255,255,0.2); }
  .music-btn svg { width: 20px; height: 20px; }
  .music-btn.playing .music-bars { display: flex; }
  .music-btn .music-icon-mute { display: none; }
  .music-btn:not(.playing) .music-bars { display: none; }
  .music-btn:not(.playing) .music-icon-mute { display: block; }
  .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
  .music-bar {
    width: 3px; background: #ffd700; border-radius: 2px;
    animation: musicBounce 0.8s ease-in-out infinite;
  }
  .music-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
  .music-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
  .music-bar:nth-child(3) { height: 6px; animation-delay: 0.3s; }
  .music-bar:nth-child(4) { height: 12px; animation-delay: 0.45s; }
  @keyframes musicBounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  /* Responsive */
  @media (max-height: 680px) {
    .robot-avatar-wrap { width: 100px; height: 120px; }
    .robot-avatar { width: 100px; height: 108px; }
    .cherry-on-head { width: 30px; height: 26px; top: 2px; right: 14px; }
    .title { font-size: 22px; }
    .group-badge span { font-size: 16px; }
    .wheel-wrapper { width: 240px; height: 240px; }
    #wheelCanvas { width: 240px; height: 240px; }
    .wheel-glow-ring { width: 260px; height: 260px; top: -10px; left: -10px; }
    .center-btn { width: 60px; height: 60px; font-size: 14px; }
    .result-main { font-size: 38px; }
    .result-punish { font-size: 22px; }
    .magic-circle-main { width: 180px; height: 180px; }
  }
  @media (max-width: 380px) {
    .wheel-wrapper { width: 250px; height: 250px; }
    #wheelCanvas { width: 250px; height: 250px; }
    .wheel-glow-ring { width: 270px; height: 270px; top: -10px; left: -10px; }
    .result-main { font-size: 40px; }
  }
</style>
</head>
<body>

<!-- Background Canvas (stars + shooting stars) -->
<canvas id="bgCanvas"></canvas>

<!-- === CAMPUS ELEMENTS === -->
<!-- School building left -->
<svg class="campus-elem school-build" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">

  <circle cx="115" cy="142" r="2.5" fill="#ffd700"/>

  <rect x="110" y="72" width="22" height="26" rx="2" fill="#ffeaa7" opacity="0.75"/>

  <circle cx="103" cy="126" r="2" fill="#ffd700"/>
  <!-- Flag -->
  <line x1="90" y1="0" x2="90" y2="30" stroke="#888" stroke-width="1.5"/>
  <rect x="91" y="2" width="16" height="10" rx="1" fill="#e74c3c" opacity="0.7"/>

<!-- Blackboard -->
<svg class="campus-elem blackboard" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="5" y="5" width="110" height="85" rx="3" fill="#2d5a3e"/>

  <text x="25" y="45" font-size="12" fill="rgba(255,255,255,0.6)" font-family="serif">ABC 123</text>
  <text x="30" y="65" font-size="10" fill="rgba(255,255,255,0.4)" font-family="serif">★ ☆ ★</text>
  <!-- Chalk tray -->
  <rect x="20" y="92" width="20" height="5" rx="2" fill="#ffeaa7" opacity="0.6"/>
  <rect x="50" y="92" width="15" height="5" rx="2" fill="#ff9ff3" opacity="0.5"/>
  <rect x="75" y="92" width="18" height="5" rx="2" fill="#87ceeb" opacity="0.5"/>
</svg>

<!-- Cherry tree left -->
<svg class="campus-elem cherry-left" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Trunk -->
  <path d="M95,220 Q90,180 80,150 Q70,120 75,90 Q80,70 90,60" stroke="#6b3a2a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M80,130 Q60,120 45,100" stroke="#6b3a2a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Cherry blossom clusters -->
  <g opacity="0.9">
    <circle cx="75" cy="55" r="22" fill="#ffb6c1"/>
    <circle cx="55" cy="50" r="18" fill="#ff9cb5"/>
    <circle cx="95" cy="45" r="20" fill="#ffc0cb"/>
    <circle cx="40" cy="65" r="15" fill="#ffaabb"/>
    <circle cx="110" cy="55" r="16" fill="#ffb6c1"/>
    <circle cx="70" cy="35" r="14" fill="#ffd1dc"/>
    <circle cx="100" cy="70" r="12" fill="#ff9cb5"/>
    <!-- Branch blossoms -->
    <circle cx="40" cy="95" r="14" fill="#ffb6c1"/>
    <circle cx="55" cy="85" r="10" fill="#ffc0cb"/>
    <circle cx="125" cy="70" r="13" fill="#ffaabb"/>
    <circle cx="115" cy="82" r="10" fill="#ff9cb5"/>
    <circle cx="135" cy="75" r="11" fill="#ffd1dc"/>
  </g>
  <!-- Cherry fruits -->
  <circle cx="60" cy="70" r="5" fill="#dc143c" opacity="0.8"/>
  <circle cx="85" cy="58" r="4.5" fill="#dc143c" opacity="0.75"/>
  <circle cx="110" cy="65" r="5" fill="#dc143c" opacity="0.8"/>
  <circle cx="45" cy="100" r="4" fill="#dc143c" opacity="0.7"/>
  <circle cx="130" cy="80" r="4.5" fill="#dc143c" opacity="0.75"/>
</svg>

<!-- Cherry tree right -->
<svg class="campus-elem cherry-right" viewBox="0 0 170 190" xmlns="http://www.w3.org/2000/svg">
  <path d="M80,190 Q78,155 70,125 Q62,95 68,70 Q74,50 82,42" stroke="#5c331e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M72,110 Q55,100 42,85" stroke="#5c331e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M75,80 Q95,65 110,60" stroke="#5c331e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g opacity="0.85">
    <circle cx="68" cy="38" r="19" fill="#ffb6c1"/>

    <circle cx="88" cy="35" r="17" fill="#ffc0cb"/>
    <circle cx="35" cy="55" r="13" fill="#ffaabb"/>
    <circle cx="100" cy="45" r="14" fill="#ffb6c1"/>
    <circle cx="65" cy="25" r="12" fill="#ffd1dc"/>
    <circle cx="38" cy="80" r="12" fill="#ffb6c1"/>
    <circle cx="48" cy="72" r="9" fill="#ffc0cb"/>
    <circle cx="108" cy="55" r="12" fill="#ffaabb"/>

  <circle cx="55" cy="50" r="4.5" fill="#dc143c" opacity="0.75"/>
  <circle cx="80" cy="40" r="4" fill="#dc143c" opacity="0.7"/>

<!-- Cherry branch top -->
<svg class="campus-elem cherry-top" viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,80 Q30,70 60,50 Q80,35 100,30 Q120,25 140,20" stroke="#6b3a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="55" cy="45" r="12" fill="#ffb6c1" opacity="0.7"/>
  <circle cx="80" cy="32" r="10" fill="#ffc0cb" opacity="0.7"/>
  <circle cx="105" cy="28" r="11" fill="#ff9cb5" opacity="0.7"/>
  <circle cx="125" cy="22" r="9" fill="#ffaabb" opacity="0.6"/>
  <circle cx="40" cy="58" r="8" fill="#ffd1dc" opacity="0.6"/>

  <circle cx="70" cy="38" r="3.5" fill="#dc143c" opacity="0.55"/>
</svg>

<!-- Pencil -->
<svg class="campus-elem pencil" viewBox="0 0 30 160" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="10" width="14" height="120" rx="1" fill="#ffd700" opacity="0.9"/>
  <rect x="8" y="10" width="14" height="120" rx="1" fill="none" stroke="#e6a800" stroke-width="1"/>

</svg>

<!-- Apple -->
<svg class="campus-elem apple-icon" viewBox="0 0 50 55" xmlns="http://www.w3.org/2000/svg">
  <path d="M25,15 Q10,15 8,32 Q6,50 25,52 Q44,50 42,32 Q40,15 25,15Z" fill="#e74c3c" opacity="0.85"/>
  <path d="M25,15 Q28,8 32,10" stroke="#5c331e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="30" cy="12" rx="6" ry="4" fill="#2ecc71" opacity="0.7" transform="rotate(-20,30,12)"/>

<!-- Book stack -->
<svg class="campus-elem book-stack" viewBox="0 0 100 55" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="35" width="80" height="12" rx="2" fill="#4ecdc4" opacity="0.7"/>
  <rect x="12" y="22" width="76" height="12" rx="2" fill="#ff6b6b" opacity="0.7"/>
  <rect x="8" y="9" width="84" height="12" rx="2" fill="#ffd700" opacity="0.7"/>
  <line x1="20" y1="40" x2="70" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="20" y1="27" x2="68" y2="27" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

</svg>

<!-- Floating cherry petals (generated by JS) -->
<div id="petals"></div>

<!-- Magic circles -->
<div class="magic-circle magic-circle-main">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,215,0,0.25)" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,215,0,0.18)" stroke-width="1"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(180,130,255,0.2)" stroke-width="1"/>
    <g stroke="rgba(255,215,0,0.35)" stroke-width="1.2" fill="none">

<script>
// === PETALS ===
(function createPetals() {
  const container = document.getElementById('petals');
  const colors = ['#ffb6c1','#ffc0cb','#ff9cb5','#ffd1dc','#ffaabb'];
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = (8 + Math.random() * 10) + 'px';
    p.style.height = (6 + Math.random() * 8) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    container.appendChild(p);
  }
})();

// === STARS BACKGROUND ===
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let stars = [];
let shootingStars = [];

function initStars() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      r: Math.random() * 2 + 0.3,
      alpha: Math.random() * 0.8 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2,
      color: ['#ffffff','#ffe4b5','#b0c4de','#e6e6fa'][Math.floor(Math.random()*4)]
    });
  }
}

function drawStars(time) {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  // Nebula
  const neb1 = bgCtx.createRadialGradient(bgCanvas.width*0.2, bgCanvas.height*0.3, 0, bgCanvas.width*0.2, bgCanvas.height*0.3, 220);
  neb1.addColorStop(0, 'rgba(100,60,180,0.05)'); neb1.addColorStop(1, 'transparent');
  bgCtx.fillStyle = neb1; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  const neb2 = bgCtx.createRadialGradient(bgCanvas.width*0.8, bgCanvas.height*0.6, 0, bgCanvas.width*0.8, bgCanvas.height*0.6, 180);
  neb2.addColorStop(0, 'rgba(60,80,180,0.04)'); neb2.addColorStop(1, 'transparent');
  bgCtx.fillStyle = neb2; bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

  stars.forEach(s => {
    const tw = Math.sin(time * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
    bgCtx.globalAlpha = s.alpha * tw;
    bgCtx.fillStyle = s.color;
    bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); bgCtx.fill();
    if (s.r > 1.3) {
      bgCtx.globalAlpha = tw * 0.3; bgCtx.strokeStyle = s.color; bgCtx.lineWidth = 0.5;
      const len = s.r * 3;
      bgCtx.beginPath();
      bgCtx.moveTo(s.x-len, s.y); bgCtx.lineTo(s.x+len, s.y);
      bgCtx.moveTo(s.x, s.y-len); bgCtx.lineTo(s.x, s.y+len);
      bgCtx.stroke();
    }
  });

  // Shooting stars
  if (shootingStars.length < 2 && Math.random() < 0.004) {
    shootingStars.push({
      x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height*0.4,
      len: Math.random()*50+30, speed: Math.random()*3+2,
      angle: Math.PI/4+(Math.random()-0.5)*0.3, alpha:1, life:0
    });
  }
  shootingStars.forEach((ss,i) => {
    ss.life++; ss.x += Math.cos(ss.angle)*ss.speed; ss.y += Math.sin(ss.angle)*ss.speed;
    ss.alpha = Math.max(0, 1 - ss.life/60);
    if (ss.alpha <= 0) { shootingStars.splice(i,1); return; }
    bgCtx.globalAlpha = ss.alpha;
    bgCtx.strokeStyle = '#fff'; bgCtx.lineWidth = 1.5;
    bgCtx.beginPath(); bgCtx.moveTo(ss.x, ss.y);
    bgCtx.lineTo(ss.x-Math.cos(ss.angle)*ss.len, ss.y-Math.sin(ss.angle)*ss.len);
    bgCtx.stroke();
  });
  bgCtx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
initStars(); requestAnimationFrame(drawStars);
window.addEventListener('resize', initStars);

// === WHEEL ===
const wheelCanvas = document.getElementById('wheelCanvas');
const wheelCtx = wheelCanvas.getContext('2d');
const segments = [
  { label: '通关', color1: '#ff6b6b', color2: '#ee5a24', icon: '\u2B50' },
  { label: '返回上一关', color1: '#4ecdc4', color2: '#2ecc71', icon: '\uD83D\uDD04' },
  { label: '原地惩罚', color1: '#ff69b4', color2: '#e84393', icon: '\u26A1' },
  { label: '原地等待30秒', color1: '#74b9ff', color2: '#0984e3', icon: '\u23F3' }
];
const punishments = ['下蹲3次','原地转圈3圈','踮脚抬手8秒','原地小跳三下','抬手伸展手臂十秒'];

let currentRotation = 0;
let isSpinning = false;
let currentGroup = 1;

function drawWheel(rotation) {
  const w = wheelCanvas.width, h = wheelCanvas.height;
  const cx = w/2, cy = h/2, r = w/2 - 10;
  wheelCtx.clearRect(0, 0, w, h);
  wheelCtx.save(); wheelCtx.translate(cx, cy); wheelCtx.rotate(rotation);
  const segAngle = (Math.PI*2) / segments.length;
  segments.forEach((seg, i) => {
    const startA = i*segAngle - Math.PI/2;
    const endA = startA + segAngle;
    const grad = wheelCtx.createRadialGradient(0,0,r*0.1,0,0,r);
    grad.addColorStop(0, seg.color2); grad.addColorStop(1, seg.color1);
    wheelCtx.beginPath(); wheelCtx.moveTo(0,0);
    wheelCtx.arc(0,0,r,startA,endA); wheelCtx.closePath();
    wheelCtx.fillStyle = grad; wheelCtx.fill();
    wheelCtx.strokeStyle = 'rgba(255,255,255,0.4)'; wheelCtx.lineWidth = 2; wheelCtx.stroke();
    wheelCtx.beginPath(); wheelCtx.arc(0,0,r-6,startA+0.05,endA-0.05);
    wheelCtx.strokeStyle='rgba(255,255,255,0.12)'; wheelCtx.lineWidth=1; wheelCtx.stroke();
    wheelCtx.save();
    const mid = startA + segAngle/2; wheelCtx.rotate(mid);
    wheelCtx.textAlign='center'; wheelCtx.textBaseline='middle';
    wheelCtx.font='28px serif'; wheelCtx.fillText(seg.icon, r*0.52, -14);
    wheelCtx.font='bold 22px "Microsoft YaHei",sans-serif';
    wheelCtx.fillStyle='white'; wheelCtx.shadowColor='rgba(0,0,0,0.5)'; wheelCtx.shadowBlur=4;
    const textR = r*0.52;
    if (seg.label.length > 4) {
      wheelCtx.fillText(seg.label.slice(0,4), textR, 16);
      wheelCtx.fillText(seg.label.slice(4), textR, 40);
    } else {
      wheelCtx.fillText(seg.label, textR, 18);
    }
    wheelCtx.shadowBlur=0; wheelCtx.restore();
  });
  wheelCtx.beginPath(); wheelCtx.arc(0,0,42,0,Math.PI*2);
  const cG = wheelCtx.createRadialGradient(0,0,0,0,0,42);
  cG.addColorStop(0,'#fff8'); cG.addColorStop(1,'#ffd700');
  wheelCtx.fillStyle=cG; wheelCtx.fill();
  wheelCtx.strokeStyle='rgba(255,255,255,0.5)'; wheelCtx.lineWidth=2; wheelCtx.stroke();
  wheelCtx.restore();
}
drawWheel(0);

function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;
  document.getElementById('spinBtn').classList.add('disabled');
  document.getElementById('resultArea').classList.remove('show');
  playSpinSound();
  const totalR = Math.PI*2*(8+Math.random()*6);
  const dur = 3800, startT = performance.now(), startR = currentRotation;
  function animate(now) {
    const p = Math.min((now-startT)/dur, 1);
    const ease = 1-Math.pow(1-p,3);
    currentRotation = startR + totalR*ease;
    drawWheel(currentRotation);
    if (p < 1) requestAnimationFrame(animate);
    else { isSpinning = false; document.getElementById('spinBtn').classList.remove('disabled'); determineResult(); }
  }
  requestAnimationFrame(animate);
}

function determineResult() {
  const norm = ((currentRotation%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const segA = (Math.PI*2)/segments.length;
  const ptrA = (Math.PI*2-norm+Math.PI)%(Math.PI*2);
  const idx = Math.floor(ptrA/segA)%segments.length;
  playResultSound(idx);
  const result = segments[idx];
  document.getElementById('resultMain').textContent = result.label;
  document.getElementById('resultPunish').textContent = '';
  if (result.label === '原地惩罚') {
    document.getElementById('resultPunish').textContent = punishments[Math.floor(Math.random()*punishments.length)];
  }
  setTimeout(() => document.getElementById('resultArea').classList.add('show'), 150);
}

// === GROUP NAVIGATION ===
function updateGroupUI() {
  document.getElementById('groupLabel').textContent = '第 ' + currentGroup + ' 组玩家';
  document.getElementById('prevGroup').style.visibility = currentGroup > 1 ? 'visible' : 'hidden';
}
function changeGroup(dir) {
  currentGroup += dir;
  if (currentGroup < 1) currentGroup = 1;
  updateGroupUI();
  document.getElementById('resultArea').classList.remove('show');
}
updateGroupUI();

// === BACKGROUND MUSIC ===
let audioCtx = null, musicPlaying = false, musicInterval = null;
function createAudioCtx() { if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playNote(freq,dur,delay,vol=0.08,type='sine') {
  const ctx=createAudioCtx(), osc=ctx.createOscillator(), g=ctx.createGain();
  osc.type=type; osc.frequency.value=freq;
  g.gain.setValueAtTime(0,ctx.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,ctx.currentTime+delay+0.05);
  g.gain.linearRampToValueAtTime(0,ctx.currentTime+delay+dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(ctx.currentTime+delay); osc.stop(ctx.currentTime+delay+dur);
}
const melody=[[523.25,.6,0],[659.25,.6,.5],[783.99,.8,1],[659.25,.4,1.6],[698.46,.6,2],[783.99,.6,2.5],[880,.8,3],[783.99,.4,3.6],[659.25,.6,4],[523.25,.6,4.5],[587.33,.8,5],[523.25,.4,5.6],[440,.6,6],[523.25,.6,6.5],[587.33,.6,7],[523.25,1,7.5]];
const bassLine=[[261.63,1,0],[196,1,2],[220,1,4],[196,1,6]];
function playMusicLoop(){melody.forEach(([f,d,t])=>{playNote(f,d,t,0.04,'sine');playNote(f*1.5,d,t,0.012,'triangle')});bassLine.forEach(([f,d,t])=>playNote(f,d*1.2,t,0.03,'sine'));}
function startMusic(){if(musicPlaying)return;createAudioCtx();musicPlaying=true;document.getElementById('musicBtn').classList.add('playing');playMusicLoop();musicInterval=setInterval(playMusicLoop,9000);}
function stopMusic(){musicPlaying=false;document.getElementById('musicBtn').classList.remove('playing');if(musicInterval)clearInterval(musicInterval);musicInterval=null;}
function toggleMusic(){if(musicPlaying)stopMusic();else startMusic();}

// === SOUND EFFECTS ===
function playSpinSound(){for(let i=0;i<8;i++)playNote(300+i*80,0.1,i*0.08,0.03,'square');}
function playResultSound(idx){
  if(idx===0){playNote(523.25,.3,0,0.1,'sine');playNote(659.25,.3,.15,0.1,'sine');playNote(783.99,.5,.3,0.12,'sine');}
  else if(idx===1){playNote(440,.3,0,0.08,'sine');playNote(349.23,.3,.2,0.08,'sine');playNote(261.63,.5,.4,0.08,'sine');}
  else if(idx===2){playNote(392,.15,0,0.08,'square');playNote(330,.15,.15,0.08,'square');playNote(392,.3,.3,0.08,'square');}
  else{playNote(800,.08,0,0.05,'sine');playNote(800,.08,.3,0.05,'sine');playNote(800,.08,.6,0.05,'sine');}
}

// Auto-start music
document.addEventListener('click',function auto(){startMusic();document.removeEventListener('click',auto);},{once:true});
</script>
