.bg-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(180deg,
        rgba(165, 42, 42, 0.15) 0%,
        rgba(165, 42, 42, 0.08) 35%,
        rgba(255, 255, 255, 0.05) 60%,
        rgba(165, 42, 42, 0.12) 100%
    );
}

/* ===== 浮动装饰 ===== */
.float-deco {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
    animation: floatUp 8s ease-in-out infinite;
}
.float-deco:nth-child(3) { left: 5%; top: 60%; animation-delay: 0s; font-size: 28px; }
.float-deco:nth-child(4) { right: 8%; top: 30%; animation-delay: 2s; font-size: 24px; }
.float-deco:nth-child(5) { left: 15%; top: 20%; animation-delay: 4s; font-size: 20px; }
.float-deco:nth-child(6) { right: 12%; top: 70%; animation-delay: 1s; font-size: 26px; }
.float-deco:nth-child(7) { left: 80%; top: 15%; animation-delay: 3s; font-size: 22px; }
.float-deco:nth-child(8) { left: 3%; top: 40%; animation-delay: 5s; font-size: 18px; }

@keyframes floatUp {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
    50% { transform: translateY(-20px) rotate(8deg); opacity: 0.7; }
}

/* ===== 主容器 ===== */
.container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 16px 50px;
}

/* ===== 标题区 ===== */
.header {
    text-align: center;
    margin-bottom: 36px;
    padding: 24px 16px;
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 2px 8px rgba(165,42,42,0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(165,42,42,0.1);
    position: relative;
    overflow: hidden;
}

.header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #a52a2a, #d47474, #a52a2a);
    border-radius: 24px 24px 0 0;
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}

.header-badge {
    display: inline-block;
    background: linear-gradient(135deg, #a52a2a, #c44545);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 18px;
    border-radius: 20px;
    letter-spacing: 2px;
    box-shadow: 0 3px 12px rgba(165,42,42,0.3);
}

.school-name {
    font-size: 14px;
    color: #a52a2a;
    font-weight: 600;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.school-name::before {
    content: '';
    width: 6px; height: 6px;
    background: #a52a2a;
    border-radius: 50%;
    display: inline-block;
}

.badge-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.badge-img {
    width: 64px; height: 64px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #a52a2a;
    box-shadow: 0 4px 16px rgba(165,42,42,0.25);
    background: #fff;
    padding: 2px;
}

.header h1 {
    font-family: 'Zcool KuaiLe', 'Noto Sans SC', sans-serif;
    font-size: 36px;
    color: #8b1a1a;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 rgba(165,42,42,0.1);
    letter-spacing: 3px;
}

.header-sub {
    font-size: 15px;
    color: #a05252;
    font-weight: 500;
    letter-spacing: 1px;
}

.header-line {
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg, #a52a2a, #d47474, #a52a2a);
    border-radius: 2px;
    margin: 14px auto 0;
}

/* ===== 分区标题 ===== */
.section-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 32px 0 20px;
}

.section-title .line {
    flex: 1;
    max-width: 80px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
}

.section-title span {
    font-family: 'Zcool KuaiLe', sans-serif;
    font-size: 20px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    white-space: nowrap;
    letter-spacing: 2px;
}

/* ===== 卡片网格 ===== */
.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
    margin-bottom: 10px;
}

/* ===== 卡片 ===== */
.card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid rgba(165,42,42,0.08);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #a52a2a, #d47474);
    border-radius: 18px 0 0 18px;
    opacity: 0;
    transition: opacity 0.3s;
}

.card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 12px 36px rgba(0,0,0,0.15), 0 4px 12px rgba(165,42,42,0.15);
    border-color: rgba(165,42,42,0.2);
}

.card:hover::before { opacity: 1; }

.card-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.card-icon.green { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }
.card-icon.blue  { background: linear-gradient(135deg, #e3f2fd, #bbdefb); }
.card-icon.orange{ background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
.card-icon.purple{ background: linear-gradient(135deg, #f3e5f5, #e1bee7); }
.card-icon.pink  { background: linear-gradient(135deg, #fce4ec, #f8bbd0); }
.card-icon.cyan  { background: linear-gradient(135deg, #e0f7fa, #b2ebf2); }
.card-icon.yellow{ background: linear-gradient(135deg, #fffde7, #fff9c4); }
.card-icon.red   { background: linear-gradient(135deg, #ffebee, #ffcdd2); }
.card-icon.teal  { background: linear-gradient(135deg, #e0f2f1, #b2dfdb); }

.card-info { flex: 1; min-width: 0; }

.card-title {
    font-size: 16px;
    font-weight: 700;
    color: #2c3e50;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 500;
}

.card-tag.choice { background: #ffebee; color: #a52a2a; }
.card-tag.judge  { background: #fff3e0; color: #c44545; }
.card-tag.drag   { background: #fce4ec; color: #a52a2a; }
.card-tag.match  { background: #ffebee; color: #c44545; }
.card-tag.lucky  { background: #fff8e1; color: #a52a2a; }

.card-arrow {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a52a2a, #c44545);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
    flex-shrink: 0;
    transition: transform 0.3s;
    box-shadow: 0 2px 8px rgba(165,42,42,0.3);
}

.card:hover .card-arrow {
    transform: translateX(4px);
}

/* ===== 二维码区 ===== */
.qr-section {
    margin-top: 40px;
    padding: 28px 20px;
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    border: 1px solid rgba(165,42,42,0.1);
    position: relative;
    overflow: hidden;
}

.qr-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #a52a2a, #d47474, #a52a2a);
}

.qr-title {
    font-family: 'Zcool KuaiLe', sans-serif;
    font-size: 20px;
    color: #8b1a1a;
    margin-bottom: 6px;
    letter-spacing: 2px;
}

.qr-sub {
    font-size: 13px;
    color: #a05252;
    margin-bottom: 18px;
}

.qr-img {
    max-width: 260px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    border: 2px solid rgba(165,42,42,0.15);
}

/* ===== 底部 ===== */
.footer {
    text-align: center;
    margin-top: 30px;
    padding: 18px;
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    letter-spacing: 1px;
}

.footer .heart {
    color: #ff8a80;
    display: inline-block;
    animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
}

/* ===== 响应式 ===== */
@media (max-width: 640px) {
    .container { padding: 16px 12px 36px; }
    .header { padding: 18px 12px; border-radius: 18px; }
    .header h1 { font-size: 24px; letter-spacing: 1px; }
    .header-sub { font-size: 13px; }
    .badge-img { width: 48px; height: 48px; }
    .cards-grid { grid-template-columns: 1fr; gap: 12px; }
    .card { padding: 14px 16px; }
    .card-icon { width: 44px; height: 44px; font-size: 22px; }
    .card-title { font-size: 15px; }
    .section-title span { font-size: 17px; }
    .qr-img { max-width: 200px; }
    .badge-wrap { gap: 10px; }
}

@media (min-width: 641px) and (max-width: 900px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
