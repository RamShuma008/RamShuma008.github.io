<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>自然小博士奔奔</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  background: #e8f5e9;
}

/* ===== 全屏背景 ===== */
#bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
#bg-layer svg { width: 100%; height: 100%; }

/* ===== 主容器 ===== */
#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 14px 36px;
}

/* ===== 标题 ===== */
.top-bar {
  width: 100%;
  max-width: 460px;
  text-align: center;
  margin-bottom: 4px;
}
.top-bar h1 {
  font-size: 28px;
  font-weight: 900;
  color: #2e7d32;
  text-shadow: 0 2px 0 #e8f5e9, 0 4px 8px rgba(46,125,50,.2);
  letter-spacing: 2px;
}

/* ===== 机器人头像 ===== */
.avatar-area {
  width: 140px;
  height: 140px;
  margin: 6px auto 14px;
  filter: drop-shadow(0 8px 24px rgba(76,175,80,.35));
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-9px); }
}

/* ===== 卡片 ===== */
.card {
  background: rgba(255,255,255,.92);
  border-radius: 24px;
  padding: 22px 20px 18px;
  width: 100%;
  max-width: 460px;
  box-shadow: 0 8px 40px rgba(76,175,80,.18), 0 2px 8px rgba(0,0,0,.06);
  backdrop-filter: blur(6px);
}

/* ===== 欢迎屏 ===== */
.welcome-msg {
  text-align: center;
  color: #33691e;
  font-size: 15px;
  line-height: 1.85;
  margin-bottom: 12px;
}
.welcome-msg strong { color: #2e7d32; font-size: 16px; }

.current-group-hint {
  text-align: center;
  font-size: 24px;
  font-weight: 900;
  color: #2e7d32;
  margin-bottom: 16px;
  padding: 16px;
  background: linear-gradient(135deg,#e8f5e9,#c8e6c9);
  border-radius: 16px;
  border: 2px dashed #81c784;
  letter-spacing: 1px;
}

.rule-tip {
  text-align: center;
  font-size: 14px;
  color: #558b2f;
  margin-bottom: 16px;
  padding: 8px 16px;
  background: rgba(255,255,255,.6);
  border-radius: 20px;
  display: inline-block;
  width: 100%;
}

/* ===== 按钮 ===== */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 16px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  letter-spacing: 1px;
  transition: transform .12s, box-shadow .12s;
  outline: none;
}
.btn:active { transform: scale(.97); }

.btn-start  { background: linear-gradient(135deg,#66bb6a,#43a047); color:#fff; box-shadow:0 6px 20px rgba(67,160,71,.4); }
.btn-start:hover { box-shadow:0 8px 28px rgba(67,160,71,.55); }
.btn-next   { background: linear-gradient(135deg,#42a5f5,#1e88e5); color:#fff; box-shadow:0 6px 20px rgba(30,136,229,.35); margin-top:10px; }
.btn-again  { background: linear-gradient(135deg,#66bb6a,#43a047); color:#fff; box-shadow:0 6px 20px rgba(67,160,71,.35); margin-top:10px; }
.btn-reset  { background: linear-gradient(135deg,#ffa726,#ef6c00); color:#fff; box-shadow:0 6px 20px rgba(239,108,0,.35); margin-top:10px; }
.btn-share  { background: linear-gradient(135deg,#ab47bc,#7b1fa2); color:#fff; box-shadow:0 6px 20px rgba(123,31,162,.35); margin-top:8px; }
.btn-submit { background: linear-gradient(135deg,#ff7043,#e64a19); color:#fff; box-shadow:0 6px 20px rgba(230,74,25,.4); }

/* ===== 答题屏 ===== */
.group-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(90deg,#66bb6a,#43a047);
  color: #fff;
  border-radius: 30px;
  padding: 6px 16px;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 10px;
  box-shadow: 0 3px 12px rgba(67,160,71,.3);
}

.progress-bar-wrap { margin-bottom: 12px; }
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #558b2f;
  margin-bottom: 5px;
}
.progress-bar { height: 8px; background: #c8e6c9; border-radius: 8px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg,#66bb6a,#43a047);
  border-radius: 8px;
  transition: width .4s ease;
}

.difficulty-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 8px;
}
.diff-basic    { background:#dcedc8; color:#33691e; }
.diff-medium   { background:#fff9c4; color:#f57f17; }
.diff-advanced { background:#ffcdd2; color:#c62828; }

.question-text {
  font-size: 18px;
  font-weight: 700;
  color: #1b5e20;
  line-height: 1.6;
  margin-bottom: 16px;
  min-height: 44px;
  text-align: center;
}

.question-hint {
  font-size: 12px;
  color: #689f38;
  text-align: center;
  margin-bottom: 12px;
  font-weight: 600;
}

/* ===== 图标消除网格 ===== */
.icon-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.icon-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 8px 10px;
  border: 3px solid #c8e6c9;
  border-radius: 18px;
  background: #f1f8e9;
  cursor: pointer;
  transition: all .18s;
  min-height: 90px;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.icon-card:active { transform: scale(.95); }

.icon-card .icon-emoji {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 4px;
  transition: transform .18s;
}

.icon-card .icon-label {
  font-size: 12px;
  font-weight: 700;
  color: #558b2f;
  text-align: center;
  line-height: 1.3;
}

/* 选中状态 - 消消乐高亮 */
.icon-card.selected {
  border-color: #ff7043;
  background: #fff3e0;
  box-shadow: 0 4px 16px rgba(255,112,67,.35);
  transform: scale(1.05);
}
.icon-card.selected .icon-emoji {
  transform: scale(1.12);
}
.icon-card.selected::after {
  content: '✓';
  position: absolute;
  top: 6px;
  right: 8px;
  width: 22px;
  height: 22px;
  background: #ff7043;
  color: #fff;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: popIn .25s ease;
}

@keyframes popIn {
  0% { transform: scale(0); }
  60% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* ===== 反馈弹层 ===== */
.feedback-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.feedback-overlay.show { opacity:1; pointer-events:all; }
.feedback-card {
  background:#fff; border-radius:28px;
  padding: 30px 24px 22px;
  text-align:center; width:86%; max-width:340px;
  box-shadow:0 16px 60px rgba(0,0,0,.2);
  transform:scale(.85); transition:transform .25s;
}
.feedback-overlay.show .feedback-card { transform:scale(1); }
.fb-emoji { font-size:54px; display:block; margin-bottom:10px; animation:bounce .5s ease; }
@keyframes bounce {
  0%,100% { transform:scale(1); }
  40%      { transform:scale(1.25); }
  70%      { transform:scale(.9); }
}
.fb-title { font-size:22px; font-weight:900; margin-bottom:6px; }
.fb-title.ok  { color:#43a047; }
.fb-title.no  { color:#e53935; }
.fb-correct-list { font-size:13px; color:#558b2f; margin-bottom:4px; line-height:1.7; }
.fb-body { font-size:14px; color:#666; margin-bottom:18px; line-height:1.6; }
.fb-btn {
  background:linear-gradient(135deg,#66bb6a,#43a047);
  color:#fff; border:none; border-radius:14px;
  padding:10px 36px; font-size:16px; font-weight:800;
  cursor:pointer; box-shadow:0 4px 14px rgba(67,160,71,.4);
  transition:transform .1s;
}
.fb-btn:active { transform:scale(.96); }

/* ===== 结算屏 ===== */
.result-top { text-align:center; margin-bottom:14px; }
.result-avatar { font-size:64px; display:block; margin-bottom:4px; }
.result-name { font-size:18px; font-weight:800; color:#1b5e20; }
.result-score-wrap { display:flex; justify-content:center; gap:8px; margin:10px 0 14px; }
.score-dot {
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:900; border:3px solid transparent;
}
.score-dot.ok  { background:#e8f5e9; border-color:#66bb6a; color:#43a047; }
.score-dot.bad { background:#ffebee; border-color:#ef5350; color:#e53935; }
.result-comment {
  font-size:14px; font-weight:700; text-align:center;
  margin-bottom:12px; padding:10px 12px; border-radius:14px;
  background:#f1f8e9; color:#33691e; line-height:1.6;
}
.badge-display {
  display: inline-block;
  padding: 10px 20px;
  background: linear-gradient(135deg,#ffd54f,#ffb300);
  color: #5d4037;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 800;
  margin: 8px 0;
  box-shadow: 0 3px 12px rgba(255,179,0,.4);
  animation: badgePop .6s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes badgePop {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

/* ===== 右侧榜单面板 ===== */
.lb-panel {
  position: fixed;
  right: 0; top: 0;
  width: 240px; height: 100%;
  background: rgba(255,255,255,.96);
  box-shadow: -4px 0 30px rgba(0,0,0,.1);
  z-index: 50;
  transform: translateX(100%);
  transition: transform .3s ease;
  padding: 18px 14px;
  overflow-y: auto;
  backdrop-filter: blur(8px);
}
.lb-panel.open { transform: translateX(0); }

.lb-panel-title {
  font-size: 16px;
  font-weight: 800;
  color: #33691e;
  margin-bottom: 14px;
  text-align: center;
}
.lb-panel-close {
  position: absolute;
  top: 12px; right: 14px;
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  color: #81c784; padding: 4px 8px;
  border-radius: 6px;
}
.lb-panel-close:hover { background: #e8f5e9; }

.lb-panel-list { list-style: none; padding: 0; }
.lb-panel-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  background: #f1f8e9;
  margin-bottom: 6px;
  font-size: 13px;
  color: #33691e;
}
.lb-panel-item:nth-child(1) { background:linear-gradient(90deg,#fff9c4,#fff176); }
.lb-panel-item:nth-child(2) { background:#e8f5e9; }
.lb-panel-item:nth-child(3) { background:linear-gradient(90deg,#f1f8e9,#dcedc8); }
.lb-panel-rank { font-size: 16px; width: 22px; text-align: center; }
.lb-panel-name { flex: 1; font-weight: 700; }
.lb-panel-score { font-weight: 800; color: #43a047; font-size: 13px; }
.lb-panel-empty { text-align: center; color: #81c784; font-size: 12px; padding: 16px 0; }

/* 榜单切换按钮 */
.lb-toggle {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 51;
  background: linear-gradient(135deg,#66bb6a,#43a047);
  color: #fff;
  border: none;
  border-radius: 12px 0 0 12px;
  padding: 14px 8px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: -3px 0 16px rgba(67,160,71,.3);
  writing-mode: vertical-lr;
  letter-spacing: 3px;
  transition: transform .3s ease;
}
.lb-toggle.shift { transform: translateY(-50%) translateX(-240px); }

/* ===== 音乐按钮 ===== */
.music-btn {
  position: fixed;
  bottom: 20px; left: 16px;
  z-index: 50;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(255,255,255,.85);
  border: 2px solid #81c784;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,.1);
  font-size: 20px;
  transition: transform .15s;
}
.music-btn:active { transform: scale(.9); }
.music-btn.off { opacity: .55; }

/* ===== 彩花 ===== */
.confetti { position:fixed; inset:0; z-index:200; pointer-events:none; }

/* ===== 分享提示 ===== */
.share-toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(.8);
  background: #333;
  color: #fff;
  padding: 14px 28px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 700;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
}
.share-toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

.hidden { display:none !important; }

@media(max-width:420px){
  .top-bar h1 { font-size:23px; }
  .avatar-area { width:110px; height:110px; }
  .question-text { font-size:16px; }
  .icon-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .icon-card { padding: 12px 6px 8px; min-height: 78px; }
  .icon-card .icon-emoji { font-size: 32px; }
  .lb-panel { width: 210px; }
  .lb-toggle.shift { transform: translateY(-50%) translateX(-210px); }
}
</style>
</head>

// ===================== 状态 =====================
let state = {
  groupNo:     1,
  pickedQs:    [],
  currentIdx:  0,
  score:       0,
  answers:     [],
  leaderboard: [],
  panelOpen:   false,
  selectedIcons: {},  // {iconIndex: true}
};

// ===================== 工具 =====================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQs() {
  const basic = shuffle(QUESTIONS.filter(q => q.diff === 'basic'));
  const adv   = shuffle(QUESTIONS.filter(q => q.diff === 'medium' || q.diff === 'advanced'));
  // 2道基础 + 1道提升（中等或进阶随机）
  return shuffle([basic[0], basic[1], adv[0]]);
}

function showScreen(id) {
  ['screen-welcome','screen-quiz','screen-result'].forEach(s =>
    document.getElementById(s).classList.add('hidden')
  );
  document.getElementById(id).classList.remove('hidden');
}

// ===================== 右侧榜单面板 =====================
function togglePanel() {
  state.panelOpen = !state.panelOpen;
  const panel = document.getElementById('lb-panel');
  const toggle = document.getElementById('lb-toggle');
  if (state.panelOpen) {
    panel.classList.add('open');
    toggle.classList.add('shift');
  } else {
    panel.classList.remove('open');
    toggle.classList.remove('shift');
  }
  renderPanel();
}

function renderPanel() {
  const el = document.getElementById('lb-panel-list');
  el.innerHTML = '';
  if (state.leaderboard.length === 0) {
    el.innerHTML = '<div class="lb-panel-empty">🌿 暂无人闯关，快来挑战吧！</div>';
    return;
  }
  const sorted = [...state.leaderboard].sort((a, b) => {
    if (b.perfect !== a.perfect) return b.perfect ? -1 : 1;
    return b.score - a.score;
  });
  const medals = ['🥇','🥈','🥉'];
  sorted.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'lb-panel-item';
    const perfectIcon = item.perfect ? ' 🏆' : '';
    li.innerHTML =
      '<span class="lb-panel-rank">' + (medals[i] || (i+1)) + '</span>' +
      '<span class="lb-panel-name">第' + item.groupNo + '组' + perfectIcon + '</span>' +
      '<span class="lb-panel-score">' + item.score + '/' + item.total + '</span>';
    el.appendChild(li);
  });
}

// ===================== 开始游戏 =====================
function startGame() {
  state.pickedQs   = pickQs();
  state.currentIdx = 0;
  state.score      = 0;
  state.answers    = [];
  state.selectedIcons = {};

  document.getElementById('quiz-badge').textContent = '🌳 第 ' + state.groupNo + ' 组';
  showScreen('screen-quiz');
  renderQ();
}

// ===================== 渲染题目 =====================
function renderQ() {
  const q     = state.pickedQs[state.currentIdx];
  const idx   = state.currentIdx;
  const total = state.pickedQs.length;

  state.selectedIcons = {};

  document.getElementById('q-text').textContent  = q.text;
  document.getElementById('prog-label').textContent = '第 '+(idx+1)+' 题 / 共 '+total+' 题';
  document.getElementById('prog-score').textContent = '得分：'+state.score+' / '+idx;
  document.getElementById('prog-fill').style.width  = (idx/total*100)+'%';

  const badge = document.getElementById('diff-badge');
  badge.textContent = q.label;
  badge.className   = 'difficulty-badge';
  badge.classList.add({ basic:'diff-basic', medium:'diff-medium', advanced:'diff-advanced' }[q.diff]);

  // 渲染图标网格
  const grid = document.getElementById('icon-grid');
  grid.innerHTML = '';
  q.icons.forEach((icon, i) => {
    const card = document.createElement('div');
    card.className = 'icon-card';
    card.innerHTML =
      '<span class="icon-emoji">' + icon.emoji + '</span>' +
      '<span class="icon-label">' + icon.name + '</span>';
    card.addEventListener('click', () => toggleIcon(i, card));
    grid.appendChild(card);
  });

  document.getElementById('btn-submit').disabled = false;
}

function toggleIcon(index, card) {
  playTapSound();
  if (state.selectedIcons[index]) {
    delete state.selectedIcons[index];
    card.classList.remove('selected');
  } else {
    state.selectedIcons[index] = true;
    card.classList.add('selected');
  }
}

// ===================== 提交答案 =====================
function submitAnswer() {
  const q = state.pickedQs[state.currentIdx];
  
  // 获取正确答案的索引
  const correctIndices = [];
  q.icons.forEach((icon, i) => { if (icon.correct) correctIndices.push(i); });
  
  // 获取用户选择的索引
  const selectedIndices = Object.keys(state.selectedIcons).map(Number).sort((a,b)=>a-b);
  
  // 比较是否完全匹配
  const isExactMatch = 
    selectedIndices.length === correctIndices.length &&
    selectedIndices.every(idx => correctIndices.includes(idx));

  const ok = isExactMatch;

  // 播放音效
  if (ok) { playCorrectSound(); }
  else { playWrongSound(); }

  if (ok) state.score++;
  state.answers.push({ q, ok });

  // 禁用提交按钮和图标
  document.getElementById('btn-submit').disabled = true;
  document.querySelectorAll('.icon-card').forEach(card => {
    card.style.pointerEvents = 'none';
  });

  const overlay = document.getElementById('feedback-overlay');
  const emoji   = document.getElementById('fb-emoji');
  const title   = document.getElementById('fb-title');
  const body    = document.getElementById('fb-body');
  const correctList = document.getElementById('fb-correct-list');

  if (ok) {
    emoji.textContent = ['🎉','🥳','⭐','🌟','✨','👍'][Math.floor(Math.random()*6)];
    title.textContent = '太棒了，消除正确！';
    title.className   = 'fb-title ok';
    correctList.textContent = '';
    body.innerHTML    = '你已经掌握了这个自然小知识！';
  } else {
    emoji.textContent = ['😅','💪','🤔','📚'][Math.floor(Math.random()*4)];
    title.textContent = '再想想哦，加油！';
    title.className   = 'fb-title no';
    const correctNames = correctIndices.map(i => q.icons[i].emoji + q.icons[i].name).join('、');
    correctList.textContent = '';
    body.innerHTML    = '正确答案：<strong>' + correctNames + '</strong>';
  }
  overlay.classList.add('show');
}

function closeFeedback() {
  document.getElementById('feedback-overlay').classList.remove('show');
  state.currentIdx++;
  if (state.currentIdx >= state.pickedQs.length) {
    setTimeout(showResult, 180);
  } else {
    renderQ();
  }
}

// ===================== 结算 =====================
function showResult() {
  const score = state.score;
  const total = state.pickedQs.length;
  const perfect = score === total;

  state.leaderboard.push({ groupNo: state.groupNo, score, total, perfect });
  if (score >= 2) launchConfetti();

  const avatarMap = { 3:'🏆', 2:'🥈', 1:'📖', 0:'💪' };
  document.getElementById('res-avatar').textContent = avatarMap[score] || '💪';
  document.getElementById('res-name').textContent   = '第 ' + state.groupNo + ' 组';

  // 徽章
  const badgeArea = document.getElementById('badge-area');
  if (perfect) {
    badgeArea.innerHTML = '<div class="badge-display">🏅 自然小博士荣誉徽章</div>';
  } else {
    badgeArea.innerHTML = '';
  }

  const dotsEl = document.getElementById('res-dots');
  dotsEl.innerHTML = '';
  state.answers.forEach(a => {
    const d = document.createElement('div');
    d.className   = 'score-dot ' + (a.ok ? 'ok' : 'bad');
    d.textContent = a.ok ? '✓' : '✗';
    dotsEl.appendChild(d);
  });

  const commentEl = document.getElementById('res-comment');
  const comments  = {
    3: '🌟 满分通关！你是真正的自然小博士！🏅',
    2: '👍 答对2题，很不错！继续加油哦～',
    1: '📚 答对1题，多观察大自然，下次一定行！',
    0: '💪 别灰心，大自然是我们的好朋友，再试试！',
  };
  commentEl.textContent = comments[score];

  showScreen('screen-result');
  renderPanel();
}

// ===================== 分享 =====================
function shareGame() {
  const url = window.location.href.split('?')[0];
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showShareToast());
  } else {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showShareToast();
  }
}

function showShareToast() {
  const toast = document.getElementById('share-toast');

}

// ===================== 彩花 =====================
function launchConfetti() {
  const c = document.getElementById('confetti-canvas');
  c.classList.remove('hidden');
  c.width  = window.innerWidth;
  c.height = window.innerHeight;
  const ctx    = c.getContext('2d');
  const colors = ['#66bb6a','#43a047','#81c784','#42a5f5','#ab47bc','#ffa726','#ef5350','#ff80ab','#ffd54f'];
  const shapes = [];
  for (let i = 0; i < 120; i++) {
    shapes.push({
      x: Math.random()*c.width, y:-20,
      size: Math.random()*8+4,
      col: colors[Math.floor(Math.random()*colors.length)],
      dx: (Math.random()-.5)*5, dy: Math.random()*4+3,
      rot: Math.random()*360, drot: (Math.random()-.5)*10,
      type: Math.random() > .5 ? 'circle' : (Math.random() > .5 ? 'leaf' : 'rect'),
    });
  }
  let frame = 0;
  (function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    shapes.forEach(s => {
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot*Math.PI/180);
      ctx.fillStyle = s.col;
      if (s.type === 'circle') {
        ctx.beginPath(); ctx.arc(0,0,s.size,0,Math.PI*2); ctx.fill();
      } else if (s.type === 'leaf') {
        ctx.beginPath();
        ctx.ellipse(0, 0, s.size, s.size*0.55, 0, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillRect(-s.size,-s.size/2.5,s.size*2,s.size/1.25);
      }
      ctx.restore();
      s.x+=s.dx; s.y+=s.dy; s.rot+=s.drot;
      if (s.y > c.height + 20) { s.y = -20; s.x = Math.random()*c.width; }
    });
    if (++frame < 150) requestAnimationFrame(draw);
    else c.classList.add('hidden');
  })();
}

// ===================== 背景音乐 =====================
let audioCtx = null, musicPlaying = false, musicInterval = null;

function createAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playNote(freq, dur, delay, vol, type) {
  vol = vol || 0.06;
  type = type || 'sine';
  try {
    const ctx = createAudioCtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t = ctx.currentTime + (delay || 0);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.04);
    g.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch(e) { /* ignore */ }
}

// 温馨自然风旋律
const natureMelody = [
  [523.25, 0.5, 0],     // C
  [587.33, 0.5, 0.45],  // D
  [659.25, 0.6, 0.9],   // E
  [523.25, 0.4, 1.4],
  [783.99, 0.5, 1.8],   // G
  [659.25, 0.5, 2.2],
  [587.33, 0.6, 2.65],
  [523.25, 0.5, 3.2],
  [392.00, 0.5, 3.65],  // G lower
  [440.00, 0.5, 4.1],
  [523.25, 0.6, 4.55],
  [587.33, 0.8, 5.1],
  [659.25, 0.5, 5.85],
  [523.25, 0.4, 6.3],
  [440.00, 0.5, 6.7],
  [523.25, 1.0, 7.15],
];

function playMusicLoop() {
  natureMelody.forEach(([f, d, t]) => {
    playNote(f, d, t, 0.045, 'sine');
    playNote(f * 2, d, t, 0.008, 'triangle');
  });
  // 低音伴奏
  [261.63, 293.66, 329.63, 261.63].forEach((f, i) => {
    playNote(f, 1.2, i * 2.1, 0.025, 'sine');
  });
}

function startMusic() {
  if (musicPlaying) return;
  createAudioCtx();
  musicPlaying = true;
  document.getElementById('music-btn').classList.remove('off');
  document.getElementById('music-btn').textContent = '🎵';
  playMusicLoop();
  musicInterval = setInterval(playMusicLoop, 9500);
}

function stopMusic() {
  musicPlaying = false;
  document.getElementById('music-btn').classList.add('off');
  document.getElementById('music-btn').textContent = '🔇';
  if (musicInterval) clearInterval(musicInterval);
  musicInterval = null;
}

function toggleMusic() {
  if (musicPlaying) stopMusic();
  else startMusic();
}

// ===================== 音效 =====================
function playCorrectSound() {
  playNote(523.25, 0.2, 0, 0.08, 'sine');
  playNote(659.25, 0.2, 0.1, 0.08, 'sine');
  playNote(783.99, 0.35, 0.2, 0.1, 'sine');
}

function playWrongSound() {
  playNote(330, 0.3, 0, 0.06, 'triangle');
  playNote(262, 0.35, 0.2, 0.06, 'triangle');
}

function playTapSound() {
  playNote(880, 0.08, 0, 0.04, 'sine');
}

document.addEventListener('click', function autoStart() {
